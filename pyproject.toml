[project]
name = "speak"
version = "0.2.0"
description = "Local TTS daemon+client: Kokoro-82M on MLX (Apple Silicon)."
requires-python = ">=3.10,<3.14"
dependencies = [
    "mlx-audio>=0.2", # Kokoro on MLX
    "misaki>=0.9.4,<0.10",
    "espeakng-loader",
    "phonemizer-fork",
    "num2words",
    "spacy>=3.8",
    "soundfile>=0.12",
]

[project.scripts]
speak = "speak.client:main"
speakd = "speak.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speak"]
